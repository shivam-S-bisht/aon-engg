[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18.20.4"

# SPA fallback rule so any direct subpath routing routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-control for immutable hashed Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
